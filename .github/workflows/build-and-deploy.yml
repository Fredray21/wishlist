name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Port local du VPS vers lequel Nginx redirige le domaine (non secret).
  HTTP_BIND: "127.0.0.1:5020"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Image Docker
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/wishlist:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/wishlist:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Déploiement VPS
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Création du .env à partir des secrets GitHub
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OWNER_NAME: ${{ vars.OWNER_NAME || 'Frédéric' }}
          BIRTHDAY_MONTH: ${{ vars.BIRTHDAY_MONTH }}
        run: |
          set -e
          test -n "$ADMIN_PASSWORD" || { echo "::error::Secret ADMIN_PASSWORD manquant"; exit 1; }
          test ${#SESSION_SECRET} -ge 32 || { echo "::error::Secret SESSION_SECRET manquant ou < 32 caractères"; exit 1; }
          mkdir -p deploy
          cp docker-compose.yml deploy/docker-compose.yml
          # printf + guillemets simples : aucun caractère des secrets n'est interprété par le shell.
          {
            printf "TAG=%s\n" "${{ github.sha }}"
            printf "IMAGE_OWNER=%s\n" "${GITHUB_REPOSITORY_OWNER,,}"
            printf "HTTP_BIND=%s\n" "$HTTP_BIND"
            printf "ADMIN_PASSWORD='%s'\n" "$ADMIN_PASSWORD"
            printf "SESSION_SECRET='%s'\n" "$SESSION_SECRET"
            printf "OWNER_NAME='%s'\n" "$OWNER_NAME"
            printf "BIRTHDAY_MONTH=%s\n" "$BIRTHDAY_MONTH"
          } > deploy/.env

      - name: Empaquetage pour le VPS
        run: |
          # Une seule connexion SSH ensuite : les fichiers voyagent en base64 dans une variable.
          PAYLOAD=$(tar czf - -C deploy docker-compose.yml .env | base64 -w0)
          echo "::add-mask::$PAYLOAD"
          echo "DEPLOY_PAYLOAD=$PAYLOAD" >> "$GITHUB_ENV"

      - name: Copie + pull + démarrage (une seule connexion SSH)
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PAYLOAD: ${{ env.DEPLOY_PAYLOAD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: DEPLOY_PAYLOAD,GHCR_TOKEN,GHCR_USER
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            mkdir -p ~/app/wishlist/data
            cd ~/app/wishlist
            echo "$DEPLOY_PAYLOAD" | base64 -d | tar xzf - -C .
            chmod 600 .env
            # data/ (la wishlist) n'est jamais touché par le déploiement.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            sleep 5
            curl -fsS http://127.0.0.1:5020/api/health && echo " <- wishlist OK" || { docker compose logs --tail 50; exit 1; }
